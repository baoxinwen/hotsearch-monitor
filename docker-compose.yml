services:
  backend:
    image: ghcr.io/baoxinwen/hotsearch-monitor-backend:main
    container_name: hotsearch-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
      - DEBUG=${DEBUG:-false}
      - API_KEY=${API_KEY:-}
      - UAPI_API_KEY=${UAPI_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - HISTORY_ENABLED=${HISTORY_ENABLED:-true}
      - HISTORY_RETENTION_DAYS=${HISTORY_RETENTION_DAYS:-7}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/baoxinwen/hotsearch-monitor-frontend:main
    container_name: hotsearch-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
