services:
  backend:
    image: ghcr.io/baoxinwen/hotsearch-monitor-backend:main
    container_name: hotsearch-backend
    restart: unless-stopped
    # 只绑定本机回环：后端无需直接对外（公网流量走 nginx 前端容器），
    # 同时防止绕过 nginx 直连后端伪造 X-Forwarded-For
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      # 说明：不再挂载宿主 zoneinfo（Windows/macOS 宿主路径不存在），统一用 TZ 环境变量
    environment:
      - TZ=Asia/Shanghai
      - DEBUG=${DEBUG:-false}
      - API_KEY=${API_KEY:-}
      - UAPI_API_KEY=${UAPI_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - HISTORY_ENABLED=${HISTORY_ENABLED:-true}
      - HISTORY_RETENTION_DAYS=${HISTORY_RETENTION_DAYS:-7}
      - MAX_HISTORY_SNAPSHOTS=${MAX_HISTORY_SNAPSHOTS:-1000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/baoxinwen/hotsearch-monitor-frontend:main
    container_name: hotsearch-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
